name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: 语法与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash 语法检查
        run: |
          for f in *.sh; do
            printf '%-24s' "$f"
            bash -n "$f" && echo "OK"
          done

      - name: ShellCheck（只拦 error 级）
        run: shellcheck --severity=error *.sh

      - name: caddy 子命令必须真实存在
        run: |
          # 写错子命令时 caddy 只会回一句 "unknown command"，如果这句提示藏在
          # 安装脚本的输出文字里，更没人会发现 —— 交给 CI 拦。
          KNOWN="adapt add-package build-info completion environ file-server fmt
                 hash-password help list-modules manpage reload remove-package
                 respond reverse-proxy run start stop storage trust untrust
                 upgrade validate version"
          NOTCMD="admin-api"

          bad=0
          for w in $(grep -rhoE '(^|[^a-zA-Z-])caddy [a-z][a-z-]+' admin-api.py *.sh \
                     | grep -oE 'caddy [a-z][a-z-]+' | awk '{print $2}' | sort -u); do
            case " $NOTCMD " in *" $w "*) continue ;; esac
            case " $KNOWN "  in *" $w "*) continue ;; esac
            echo "  不存在的子命令: caddy $w"
            bad=1
          done
          [ "$bad" -eq 0 ] || { echo "以上子命令 caddy 不认，执行时会 unknown command"; exit 1; }
          echo "  所有 caddy 子命令均存在"

      - name: Python 编译检查
        run: python3 -m py_compile admin-api.py telegram-bot.py

      - name: 机器人输入校验（域名 / 上游必须拦住脏输入）
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("bot", "telegram-bot.py")
          bot = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bot)

          # 合法上游：host:port / scheme://host:port / unix socket
          for u in ["127.0.0.1:8080", "http://127.0.0.1:8080", "wiki:3000",
                    "https://backend.example.com", "[::1]:8080", "unix//run/app.sock"]:
              assert bot.valid_upstream(u), "应接受的上游被拒了: %s" % u

          # 脏输入：带路径、结尾斜杠、没端口、端口越界 —— 这些都会让 caddy adapt 失败
          for u in ["http://127.0.0.1:8080/", "127.0.0.1:8080/api", "127.0.0.1",
                    "", "1.2.3.4:99999", "a b:1", "http://h:80/x"]:
              assert not bot.valid_upstream(u), "应拒绝的上游被接受了: %r" % u

          for d in ["oci.example.com", "a-b.c.example.com"]:
              assert bot.RE_DOMAIN.match(d), "应接受的域名被拒了: %s" % d
          for d in ["oci", "http://oci.example.com", "oci.example.com/", "-bad.com",
                    "a..b.com", "oc i.com", "../etc/passwd"]:
              assert not bot.RE_DOMAIN.match(d), "应拒绝的域名被接受了: %s" % d

          assert bot.validate("oci.example.com", "127.0.0.1:8080") is None
          assert bot.validate("../etc/passwd", "127.0.0.1:8080") is not None
          print("机器人输入校验：全部通过")
          PY

      - name: 交付物完整性
        run: |
          missing=0
          for f in LICENSE README.md Caddyfile admin-api.py admin-ui.html \
                   admin-api.service bootstrap.sh setup.sh deploy.sh update.sh \
                   add-site.sh cf.sh sync-dns.sh enable-cf-native.sh docs/index.html \
                   telegram-bot.py telegram-bot.service telegram-bot-setup.sh \
                   telegram-bot-reload.path telegram-bot-reload.service; do
            if [ -f "$f" ]; then echo "  ok   $f"; else echo "  MISS $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "有文件缺失"; exit 1; }

      - name: 敏感文件不应入库
        run: |
          ! git ls-files | grep -E '(^|/)(cf\.env|telegram\.env|\.cf_token)(\..*)?$'
          echo "未发现被跟踪的凭据文件"
          if git grep -nE 'TELEGRAM_BOT_TOKEN=[0-9]{5,}:[A-Za-z0-9_-]{30,}' -- . \
               ':!README.md' ':!*.sh'; then
            echo "有真实的 Telegram Bot Token 被写进了代码"; exit 1
          fi
          echo "未发现硬编码的 Bot Token"

  smoke:
    name: 面板 API 冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 启动后端（演示模式）
        run: |
          python3 admin-api.py --mock --port 8848 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8848/api/ping >/dev/null && break
            sleep 0.5
          done

      - name: 接口可用性
        run: |
          for ep in ping status sites dns certs config telegram; do
            printf '%-8s' "$ep"
            curl -sf -o /dev/null -w 'HTTP %{http_code}\n' "http://127.0.0.1:8848/api/$ep"
          done
          curl -sf -o /dev/null -w '首页     HTTP %{http_code}\n' http://127.0.0.1:8848/

      - name: 安全校验必须拦截路径穿越
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8848/api/sites \
            -H 'Content-Type: application/json' \
            -d '{"domain":"../etc/passwd","upstream":"127.0.0.1:1"}')
          echo "非法域名返回 $code"
          [ "$code" = "400" ] || { echo "路径穿越没被拦住"; exit 1; }

      - name: Telegram 接口·脏输入必须 400，且不回显 Token
        run: |
          # 状态接口先通一遍
          curl -sf http://127.0.0.1:8848/api/telegram -o /dev/null

          # 这三条都必须停在 400，一步都不许走到写 telegram.env
          for body in '{"token":"bad"}' \
                      '{}' \
                      '{"token":"123456789:AAE-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","allowedIds":"1; rm -rf /"}'; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://127.0.0.1:8848/api/telegram/apply \
              -H 'Content-Type: application/json' -d "$body")
            echo "  $body -> HTTP $code"
            [ "$code" = "400" ] || { echo "脏输入没被拦住"; exit 1; }
          done

          # 格式合法的假 Token：应 200，且响应里绝不能出现完整 Token
          tok='123456789:AAE-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          out=$(curl -s -X POST http://127.0.0.1:8848/api/telegram/apply \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$tok\",\"allowedIds\":\"100000002\"}")
          echo "  -> $out"
          printf '%s' "$out" | grep -q '100000002' || { echo "白名单没被接受"; exit 1; }
          if printf '%s' "$out" | grep -q "$tok"; then
            echo "完整 Token 被回显到了响应里"; exit 1
          fi
          echo "  Token 未被回显 ✓"

      - name: 清理
        if: always()
        run: pkill -f 'admin-api.py' || true
