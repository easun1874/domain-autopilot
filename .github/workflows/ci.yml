name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: 语法与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash 语法检查
        run: |
          for f in *.sh; do
            printf '%-24s' "$f"
            bash -n "$f" && echo "OK"
          done

      - name: ShellCheck（只拦 error 级）
        run: shellcheck --severity=error *.sh

      - name: Python 编译检查
        run: python3 -m py_compile admin-api.py

      - name: 交付物完整性
        run: |
          missing=0
          for f in LICENSE README.md Caddyfile admin-api.py admin-ui.html \
                   admin-api.service bootstrap.sh setup.sh deploy.sh update.sh \
                   add-site.sh cf.sh sync-dns.sh enable-cf-native.sh docs/index.html; do
            if [ -f "$f" ]; then echo "  ok   $f"; else echo "  MISS $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "有文件缺失"; exit 1; }

      - name: 敏感文件不应入库
        run: |
          ! git ls-files | grep -E '(^|/)(cf\.env|\.cf_token)(\..*)?$'
          echo "未发现被跟踪的凭据文件"

  smoke:
    name: 面板 API 冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 启动后端（演示模式）
        run: |
          python3 admin-api.py --mock --port 8848 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8848/api/ping >/dev/null && break
            sleep 0.5
          done

      - name: 接口可用性
        run: |
          for ep in ping status sites dns certs config; do
            printf '%-8s' "$ep"
            curl -sf -o /dev/null -w 'HTTP %{http_code}\n' "http://127.0.0.1:8848/api/$ep"
          done
          curl -sf -o /dev/null -w '首页     HTTP %{http_code}\n' http://127.0.0.1:8848/

      - name: 安全校验必须拦截路径穿越
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8848/api/sites \
            -H 'Content-Type: application/json' \
            -d '{"domain":"../etc/passwd","upstream":"127.0.0.1:1"}')
          echo "非法域名返回 $code"
          [ "$code" = "400" ] || { echo "路径穿越没被拦住"; exit 1; }

      - name: 清理
        if: always()
        run: pkill -f 'admin-api.py' || true
